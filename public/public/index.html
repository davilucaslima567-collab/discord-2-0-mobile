<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord 2.0 V6</title><link rel="stylesheet" href="style.css?v=211"></head><body>
<div id="login" class="login-screen"><div class="login-card"><div class="brand-mark">D2</div><h1>Discord 2.0 V6</h1><p>Chat, servidores, DMs e calls em tempo real.</p><label>NOME DE USUÁRIO</label><input id="name" maxlength="24" placeholder="Seu nome"><button id="join" type="button">Entrar</button><div id="loginStatus" class="login-status">Conectando ao servidor...</div><div id="savedAccounts" class="login-saved"></div></div></div>
<div id="app" class="discord hidden">
<nav class="server-rail"><button class="server-icon home active" id="homeBtn">D2</button><div class="rail-line"></div><div id="serverIcons"></div><button id="addServer" class="server-icon add">+</button></nav>
<aside class="sidebar"><div class="server-header"><b id="serverName">Servidor</b><button id="serverMenu">⌄</button></div><div class="sidebar-scroll">
<button id="friendsBtn" class="nav-row">👥 Amigos</button><div id="dmSection" class="channel-group"><div class="group-title"><span>MENSAGENS DIRETAS</span><button id="newDm">＋</button></div><div id="dmList"></div></div>
<div class="channel-group"><div class="group-title"><span>⌄ CANAIS DE TEXTO</span><button id="addTextChannel">＋</button></div><div id="textChannels"></div></div>
<div class="channel-group"><div class="group-title"><span>⌄ CANAIS DE VOZ</span><button id="addVoiceChannel">＋</button></div><div id="voiceChannels"></div></div></div>
<div id="voiceConnection" class="voice-connection hidden"><div><b>Voz conectada</b><small id="voiceConnectionName">Geral</small></div><button id="disconnectVoice">☎</button></div>
<div class="profile-bar"><button id="profileBtn" class="profile-main"><span id="myAvatar" class="avatar small"></span><span class="profile-copy"><b id="myName">Usuário</b><small id="myStatus">Online</small></span></button><div class="profile-actions"><button id="mute">🎙️</button><button id="deafen">🎧</button><button id="settings">⚙️</button></div></div></aside>
<main class="content"><header class="topbar"><div><span id="channelIcon">#</span><b id="channelTitle">geral</b><span id="channelTopic" class="topic"></span></div><div class="top-actions"><button id="searchBtn">🔎</button><span id="status">● Conectado</span><button id="memberToggle">👥</button></div></header>
<section id="chatView" class="chat-view"><div class="v6-tools"><button id="inviteBtn">🔗 Convite</button><button id="roleBtn">🛡️ Cargos</button><button id="attachBtn">📎 Arquivo</button><input id="attachFile" type="file" hidden></div><div id="messages" class="messages"></div><div id="typing" class="typing"></div><div id="replyBar" class="reply-bar hidden"></div><div class="composer"><button id="plusBtn" class="plus-btn">＋</button><input id="msg" placeholder="Conversar" autocomplete="off"><span>GIF 🙂</span></div></section>
<section id="dmView" class="chat-view hidden"><div id="dmMessages" class="messages"></div><div class="composer"><input id="dmMsg" placeholder="Mensagem direta" autocomplete="off"></div></section>
<section id="callView" class="call-view hidden"><div class="call-top"><div><b id="callTitle">🔊 Geral</b><small>Canal de voz</small></div><button id="returnChat">💬 Voltar</button></div><div id="participantGrid" class="participant-grid"></div><div id="screenStage" class="screen-stage hidden"></div><div class="call-controls"><button id="callMute">🎙️</button><button id="callDeafen">🎧</button><button id="camera">📹</button><button id="screen">🖥️</button><button id="leaveCall" class="danger">☎</button></div></section>
<section id="friendsView" class="friends-view hidden"><div class="friends-head"><h2>👥 Amigos</h2><button id="addFriend">Adicionar amigo</button></div><div id="friendsList"></div></section>
</main><aside id="membersPanel" class="members-panel"><div class="member-section">ONLINE — <span id="onlineCount">0</span></div><div id="users"></div></aside></div>
<div id="profileModal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="profileModal">✕</button><h2>Editar perfil</h2><div class="profile-preview"><span id="previewAvatar" class="avatar big"></span><div><b id="previewName">Usuário</b><small id="previewRole">Membro</small></div></div><label>Foto de perfil</label><input id="avatarFile" type="file" accept="image/*"><label>Cor</label><input id="profileColor" type="color" value="#5865f2"><label>Status</label><input id="statusText" maxlength="40"><label>Presença</label><select id="presence"><option>Online</option><option>Ausente</option><option>Não perturbe</option><option>Invisível</option></select><button id="saveProfile" class="primary">Salvar</button></div></div>
<div id="settingsModal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="settingsModal">✕</button><h2>Configurações de voz</h2><label>Microfone</label><select id="micSelect"></select><label>Saída</label><select id="speakerSelect"></select><button id="refreshDevices" class="primary">Atualizar dispositivos</button></div></div>

<nav class="mobile-nav" id="mobileNav">
  <button id="mobileServers" title="Servidores">D2</button>
  <button id="mobileChannels" title="Canais">☰</button>
  <button id="mobileChat" title="Chat">💬</button>
  <button id="mobileFriends" title="Amigos">👥</button>
  <button id="mobileProfile" title="Perfil">⚙️</button>
</nav>
<script src="/socket.io/socket.io.js"></script><script src="app.js?v=211"></script></body></html>
