services:
  - type: web
    name: discord-2-0-v6
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
    disk:
      name: discord-data
      mountPath: /var/data
      sizeGB: 1
